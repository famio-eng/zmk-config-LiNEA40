name: Generate Japanese Locale for ZMK

on:
  workflow_dispatch:

jobs:
  build-locale:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Clone locale generator
        run: git clone https://github.com/brettmilliken/zmk-locale-generator.git

      - name: Generate JA locale
        run: |
          cd zmk-locale-generator
          python3 generate.py --locale ja --output ../generated_locale

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ja-locale
          path: generated_locale/*

          # [ここに追加] PMW3610ドライバを最新の Kumamuk-git から確実に更新する
      - name: Force west update for modules
        run: west update
        # west update は ZMK のセットアップが完了した後で実行する必要があります。

      # ... 既存の west build コマンドを含むステップ
      - name: West Build
