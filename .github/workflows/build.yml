on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Build ZMK Firmware
        # ZMK標準アクションの呼び出し
        uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.2.1
        # 🚨 ZMKアクション実行時にのみ環境変数を適用
        env:
          ZMK_STUDIO_SNIPPET: ''
