# GPIO
CONFIG_NFCT_PINS_AS_GPIOS=y

# Mouse Emulation
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y

# Trackball - PMW3610 Driver
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_CPI=600
CONFIG_PMW3610_CPI_DIVIDOR=1
CONFIG_PMW3610_SNIPE_CPI=450
CONFIG_PMW3610_SNIPE_CPI_DIVIDOR=1
CONFIG_PMW3610_SCROLL_TICK=2
CONFIG_PMW3610_POLLING_RATE_125_SW=y
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=40
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=9600
CONFIG_PMW3610_INVERT_Y=y
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_INVERT_SCROLL_Y=n
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=100000

# Battery
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10

# 電源管理
CONFIG_PM_DEVICE=n

# DYA Studio 基本設定
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=y

# 修正ポイント：
# 外部モジュール(zmk-module-runtime-input-processor)を強制的にリンクさせるため、
# 依存関係の根幹となる名前を指定します。
# もし 'S' ありでエラーが出るなら、まずは 'S' なしの「本体側が期待する可能性のある名前」を試します。

CONFIG_ZMK_INPUT_PROCESSOR=y
CONFIG_ZMK_INPUT_PROCESSOR_RUNTIME=y
CONFIG_ZMK_INPUT_PROCESSOR_RUNTIME_STUDIO_RPC=y

# さらに、リンカーエラー（ord_24）を防ぐため、
# リスナー機能そのものを明示的に有効化します。
CONFIG_ZMK_INPUT_LISTENER=y
