# --- GPIO / Mouse / Trackball 基本 (物理動作) ---
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_CPI=400
CONFIG_PMW3610_INVERT_Y=y
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=100000

# --- 電池・表示・ウィジェット ---
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- ZMK Studio 核心機能 ---
CONFIG_ZMK_STUDIO=y

# --- 【復活】オートマウス・レイヤー連携 (Runtime Input Processor) ---
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_STUDIO_RPC_RUNTIME_INPUT_PROCESSOR=y

# --- 【復活】バッテリーヒストリー連携 ---
CONFIG_ZMK_BATTERY_HISTORY=y
CONFIG_ZMK_BATTERY_HISTORY_STUDIO_RPC=y

# --- 【復活】エンコーダー動的制御 (Runtime Sensor Rotate) ---
CONFIG_ZMK_BEHAVIOR_RUNTIME_SENSOR_ROTATE=y
CONFIG_ZMK_STUDIO_RPC_SENSORS=y

# --- 【復活】Settings / その他連携 ---
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO_RPC=y
CONFIG_ZMK_INPUT_LISTENER=y
CONFIG_ZMK_BLE_MANAGEMENT=y
