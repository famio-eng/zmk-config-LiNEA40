# --- GPIO / Mouse / Trackball 基本 (維持) ---
CONFIG_NFCT_PINS_AS_GPIOS=y
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_MOUSE=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_PMW3610=y
CONFIG_PMW3610_SMART_ALGORITHM=y
CONFIG_PMW3610_CPI=600
CONFIG_PMW3610_INVERT_Y=y
CONFIG_PMW3610_INVERT_X=y
CONFIG_PMW3610_AUTOMOUSE_TIMEOUT_MS=100000
CONFIG_PM_DEVICE=n

# --- Battery / RGB Widget (維持) ---
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=30

# --- DYA Studio 基本機能 ---
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_TRANSPORT_BLE=y

# --- Input Processor 連携 (最小構成) ---
# コンパイルエラーを避けるため、STUDIO_RPC は無効にします
CONFIG_ZMK_INPUT_LISTENER=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
# CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC は記述しない(default: n)

# --- エラーを出している他の外部モジュールを一時無効化 ---
# これらは現在、本体の API バージョンと不整合を起こしています
CONFIG_ZMK_BLE_MANAGEMENT=n
CONFIG_ZMK_BATTERY_HISTORY=n
CONFIG_ZMK_SETTINGS_RPC=n
